<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <!-- Soft Meta-style ambient blur filters -->
    <filter id="metaBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52" />
    </filter>
    <filter id="cardShadow" x="-8%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.045" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f4f6fb" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0064e0" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#0064e0" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0064e0" stop-opacity="0.2" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Main Canvas -->
  <rect width="1080" height="500" rx="24" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Subtle Meta Ambient Blurred Orbs -->
  <circle cx="190" cy="120" r="130" fill="#dbeafe" opacity="0.65" filter="url(#metaBlur)" />
  <circle cx="540" cy="260" r="150" fill="#e0e7ff" opacity="0.55" filter="url(#metaBlur)" />
  <circle cx="890" cy="150" r="130" fill="#f3e8ff" opacity="0.50" filter="url(#metaBlur)" />
  <circle cx="820" cy="390" r="110" fill="#dcfce7" opacity="0.40" filter="url(#metaBlur)" />

  <!-- Top Header Bar -->
  <text x="44" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#0064e0">SYSTEM ARCHITECTURE</text>
  <text x="44" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#0f172a">Wan 2.1 End-to-End Inference Pipeline on Tesla T4</text>
  <rect x="826" y="42" width="210" height="28" rx="14" fill="#ffffff" fill-opacity="0.85" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="844" cy="56" r="4" fill="#0064e0" />
  <text x="856" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#334155">15.0 GB VRAM · 12.7 GB RAM</text>

  <!-- ================= STAGE 1 CARD ================= -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="104" width="300" height="352" rx="18" fill="#ffffff" fill-opacity="0.86" stroke="#e2e8f0" stroke-width="1.2" />
  </g>
  <rect x="64" y="128" width="74" height="22" rx="11" fill="#eff6ff" />
  <text x="101" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#0064e0">STAGE 01</text>
  <text x="148" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748b">0 MB VRAM · 0 MB RAM</text>

  <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#0f172a">Cloud Prompt Conditioning</text>
  <text x="64" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#64748b">Decouples text expansion from local memory</text>

  <!-- Sub-box 1.1 -->
  <rect x="64" y="216" width="252" height="62" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="80" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Multilingual User Input</text>
  <text x="80" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Short natural prompt in ES / EN + Format</text>

  <!-- Sub-box 1.2 -->
  <rect x="64" y="292" width="252" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="80" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Serverless Director Router</text>
  <text x="80" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Tier 1: Qwen 2.5-72B Instruct (HF API)</text>
  <text x="80" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Tier 2: GTX Translate + Optical Composer</text>

  <!-- Sub-box 1.3 -->
  <rect x="64" y="378" width="252" height="56" rx="12" fill="#f0f7ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="80" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#0064e0">Dense Conditioning Pair</text>
  <text x="80" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#334155">80-word optical prompt + dynamic negative</text>

  <!-- Connector 1 -> 2 -->
  <line x1="340" y1="280" x2="382" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ================= STAGE 2 CARD ================= -->
  <g filter="url(#cardShadow)">
    <rect x="390" y="104" width="300" height="352" rx="18" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1" stroke-width="1.2" />
  </g>
  <rect x="414" y="128" width="74" height="22" rx="11" fill="#eff6ff" />
  <text x="451" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#0064e0">STAGE 02</text>
  <text x="498" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748b">GPU-Resident Synthesis</text>

  <text x="414" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#0f172a">3D Spatiotemporal Diffusion</text>
  <text x="414" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#64748b">Inverted memory topology (0 GB CPU offload)</text>

  <!-- Sub-box 2.1 -->
  <rect x="414" y="216" width="252" height="62" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="430" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">UMT5-XXL in 4-bit NF4</text>
  <text x="430" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Streamed to GPU (2.4 GB VRAM vs 22.7 GB)</text>

  <!-- Sub-box 2.2 -->
  <rect x="414" y="292" width="252" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="430" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Wan 2.1 DiT 1.3B (Native FP16)</text>
  <text x="430" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">UniPC (flow_shift = 3.0) · 45 steps · CFG 5.0</text>
  <text x="430" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">65–81 frames (4.1s–5.1s continuous 480p)</text>

  <!-- Sub-box 2.3 -->
  <rect x="414" y="378" width="252" height="56" rx="12" fill="#f0f7ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="430" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#0064e0">Live x0 Trajectory Preview</text>
  <text x="430" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#334155">Decodes active 3D slice at steps 8, 18, 30</text>

  <!-- Connector 2 -> 3 -->
  <line x1="690" y1="280" x2="732" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ================= STAGE 3 CARD ================= -->
  <g filter="url(#cardShadow)">
    <rect x="740" y="104" width="300" height="352" rx="18" fill="#ffffff" fill-opacity="0.86" stroke="#e2e8f0" stroke-width="1.2" />
  </g>
  <rect x="764" y="128" width="74" height="22" rx="11" fill="#eff6ff" />
  <text x="801" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#0064e0">STAGE 03</text>
  <text x="848" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748b">RAM Eviction &amp; Export</text>

  <text x="764" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#0f172a">3D VAE Decode &amp; Mastering</text>
  <text x="764" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#64748b">Eliminates final-step 3D decoding OOM spikes</text>

  <!-- Sub-box 3.1 -->
  <rect x="764" y="216" width="252" height="62" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="780" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Pre-VAE Dynamic DiT Eviction</text>
  <text x="780" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Offloads 2.6 GB DiT to 9.7 GB free Host RAM</text>

  <!-- Sub-box 3.2 -->
  <rect x="764" y="292" width="252" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="780" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Tiled FP32 3D Causal VAE</text>
  <text x="780" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Spatial &amp; temporal slicing with &gt;11 GB free</text>
  <text x="780" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" fill="#64748b">Zero float16 quantization banding</text>

  <!-- Sub-box 3.3 -->
  <rect x="764" y="378" width="252" height="56" rx="12" fill="#f0f7ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="780" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#0064e0">Lossless H.264 MP4 Output</text>
  <text x="780" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#334155">FFmpeg raw RGB pipe (-crf 14 -preset slow)</text>
</svg>
